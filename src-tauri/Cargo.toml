[package]
name = "encounters"
version = "0.1.0"
description = "Encounter builder and initiative tracker for 5e and other tabletop RPGs"
edition = "2021"

[lib]
name = "encounters_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# The shared Campaign Link folder on Android (from the campaign-link repo, shared with Lorekeeper).
tauri-plugin-link-folder = { git = "https://github.com/ImDeadWeight/campaign-link", tag = "v0.3.0" }

# Desktop only: Android and iOS keep a single copy of an app themselves.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
